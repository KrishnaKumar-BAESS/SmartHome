<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef1f5" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. "system"
      // (the default) follows the OS preference.
      try {
        var housedocsTheme = localStorage.getItem('housedocs-theme');
        var housedocsDark =
          housedocsTheme === 'dark' ||
          (housedocsTheme !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = housedocsDark
          ? 'dark'
          : 'light';
        if (housedocsDark)
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', '#0b0e13');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <meta
      name="description"
      content="Explore your home's rooms, circuits, lighting, network, and maintenance in an interactive house model."
    />
    <title>SmartHome · House documentation</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='#9aa0fa'/%3E%3Cstop offset='.55' stop-color='#7b83f6'/%3E%3Cstop offset='1' stop-color='#5059c9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(#g)'/%3E%3Cg fill='none' stroke='#fff' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M16 6.5l8.2 4.7v9.6L16 25.5l-8.2-4.7v-9.6z'/%3E%3Cpath d='M16 16l8.2-4.8M16 16l-8.2-4.8M16 16v9.5' opacity='.65'/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>
      html {
        background: #eef1f5;
      }
      html[data-theme='dark'] {
        background: #0b0e13;
      }
      .boot-fallback {
        font-family: system-ui, sans-serif;
        max-width: 520px;
        margin: 12vh auto;
        padding: 0 20px;
        color: #0f1722;
        line-height: 1.5;
      }
      [data-theme='dark'] .boot-fallback {
        color: #eef2f7;
      }
      .boot-fallback h1 {
        font-size: 18px;
      }
      .boot-fallback pre {
        white-space: pre-wrap;
        font-size: 12px;
        opacity: 0.8;
      }
      .boot-fallback button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #8d97a6;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .boot-wait {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 16vh;
        font-size: 13px;
        color: #627080;
        animation: boot-in 0.6s 0.2s ease both;
      }
      [data-theme='dark'] .boot-wait {
        color: #87929f;
      }
      .boot-mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(145deg, #9aa0fa, #7b83f6 55%, #5059c9);
        box-shadow: 0 10px 28px -8px rgba(123, 131, 246, 0.7);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(0.92);
          opacity: 0.75;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
        }
      }
      #boot[data-failed] .boot-wait {
        display: none;
      }
      #boot:not([data-failed]) .boot-failed {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="boot-fallback">
        <h1>HOUSE.SYS needs JavaScript</h1>
        <p>
          The interactive house atlas renders its model and inventory in the
          browser. Enable JavaScript for this site and reload. The recorded
          inventory itself lives in the repository at
          <code>home-docs/apps/web/src/data/house.ts</code>.
        </p>
      </div>
    </noscript>
    <div id="boot" class="boot-fallback" aria-live="polite">
      <div class="boot-wait">
        <span class="boot-mark" aria-hidden="true"></span>
        <p>Loading the house atlas…</p>
      </div>
      <div class="boot-failed" role="alert">
        <h1>The house atlas did not start</h1>
        <p>
          Its script bundle failed to load or run. Check the connection or the
          hosted build, then reload. Nothing is cached offline.
        </p>
        <p>
          <button type="button" onclick="window.location.reload()">
            Reload
          </button>
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // If the module bundle never mounts (blocked asset, load error), show a
      // readable failure instead of a permanent "Loading…".
      (function () {
        var boot = document.getElementById('boot');
        function failed() {
          var b = document.getElementById('boot');
          if (b) b.setAttribute('data-failed', '');
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e && e.target && e.target.tagName === 'SCRIPT') failed();
          },
          true,
        );
        setTimeout(function () {
          if (
            document.getElementById('boot') === boot &&
            boot &&
            boot.isConnected
          )
            failed();
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
